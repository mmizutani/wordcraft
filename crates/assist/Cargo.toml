[package]
name = "wordcraft-assist"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordCraft's built-in writing assistant: a conversation with a model that joins the shared document as a participant and edits it through the command registry"

[lints]
workspace = true

[dependencies]
wordcraft-doc = { workspace = true }
wordcraft-engine = { workspace = true }
# The tools an assistant's model calls are the MCP server's (one list, one implementation).
wordcraft-mcp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

# Desktop only. Sign in with ChatGPT and the ChatGPT backend (`chatgpt`): HTTPS, the PKCE hash
# and the operating system's random numbers. ACP agents (`acp`): random numbers too, for the
# new empty folder each agent starts in, whose name nobody can guess. The web build has neither.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
getrandom = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Ending an ACP agent's whole process group: an adapter run through npx is a few processes.
# Already in the lock as a dependency of other crates.
rustix = { version = "1", features = ["process"] }

[target.'cfg(windows)'.dependencies]
# Safe ownership of the agent's whole process tree; no Windows FFI in this crate.
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "job-object", "creation-flags"] }
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }
