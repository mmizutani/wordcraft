[package]
name = "wordcraft-assist"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordCraft's built-in writing assistant: a conversation with a model that joins the shared document as a participant and edits it through the command registry"

[lints]
workspace = true

[dependencies]
wordcraft-doc = { workspace = true }
wordcraft-engine = { workspace = true }
# Answers are read as Markdown with the parser the file formats use (`answer`).
wordcraft-formats = { workspace = true }
# The tools an assistant's model calls are the MCP server's (one list, one implementation).
wordcraft-mcp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# What the person said no to is kept as a hash of its text (`memory`); also the PKCE hash.
sha2 = { workspace = true }
# Dates of case notes and balance assessments (`cases`): time goes through chrono.
chrono = { workspace = true }

# Desktop only. Sign in with ChatGPT and the ChatGPT backend (`chatgpt`): HTTPS and the operating
# system's random numbers. ACP agents (`acp`): random numbers too, for the
# new empty folder each agent starts in, whose name nobody can guess. The web build has neither.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { workspace = true }
base64 = { workspace = true }
getrandom = { workspace = true }
# The ChatGPT sign-in at rest (`chatgpt::vault`): sealed with AES-256-GCM, whose key is in the
# system's keychain. ring (Apache-2.0 AND ISC) is already in the lock through rustls. keyring 4
# (MIT OR Apache-2.0) with its default `v1` stores is pure Rust over the system's own APIs: Keychain
# Services (security-framework, already in the lock), Windows Credential Manager (windows-sys,
# already in the lock) and the Secret Service over zbus 5 with async-io, which AccessKit already
# builds, and RustCrypto for the session's encryption: no libdbus and no OpenSSL.
ring = "0.17"
keyring = "4.2"

[target.'cfg(unix)'.dependencies]
# Ending an ACP agent's whole process group: an adapter run through npx is a few processes.
# Already in the lock as a dependency of other crates.
rustix = { version = "1", features = ["process"] }

[target.'cfg(windows)'.dependencies]
# Safe ownership of the agent's whole process tree; no Windows FFI in this crate.
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "job-object", "creation-flags"] }
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }

# The evaluation harness's checks have unit tests; `cargo test` runs them.
[[example]]
name = "case_eval"
test = true

[dev-dependencies]
# Requests for the MCP endpoint in front of the room's port, end to end (#75).
wordcraft-http = { workspace = true }
