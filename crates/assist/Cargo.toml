[package]
name = "wordcraft-assist"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordCraft's built-in writing assistant: a conversation with a model that joins the shared document as a participant and edits it through the command registry"

[lints]
workspace = true

[dependencies]
wordcraft-doc = { workspace = true }
wordcraft-engine = { workspace = true }
# The tools an assistant's model calls are the MCP server's (one list, one implementation).
wordcraft-mcp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

# Sign in with ChatGPT and the ChatGPT backend (`chatgpt`), desktop only: HTTPS, the PKCE hash
# and the operating system's random numbers. The web build has neither.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
getrandom = { workspace = true }
