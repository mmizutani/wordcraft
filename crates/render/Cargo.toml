[package]
name = "wordcraft-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordCraft rasteriser: pages and thumbnails from the layout display list (vello_cpu), PNG/JPEG export"

[lints]
workspace = true

[dependencies]
wordcraft-geom = { workspace = true, features = ["image"] }
wordcraft-doc = { workspace = true }
wordcraft-fonts = { workspace = true }
wordcraft-layout = { workspace = true }
wordcraft-metafile = { workspace = true }
vello_cpu = { workspace = true }
image = { workspace = true }
# Feature unification (build speed, #44): the dev-dependencies of `cargo test --workspace` turn on
# these features, so the normal build turns them on too. Then `cargo build` and `cargo test` share
# one build of every workspace library instead of compiling each twice. They add no code: the
# features are already on in every test build. Check with `cargo xtask unified`.
# (`default` is `std`, which vello's own dependency already enables; hayro's adds the name.)
fearless_simd = { version = "0.4", features = ["default"] }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
