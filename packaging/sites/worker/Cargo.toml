[package]
name = "wordcraft-sites-worker"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
probe = []

[dependencies]
wordcraft-doc = { path = "../../../crates/doc" }
wordcraft-docx = { path = "../../../crates/docx" }
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
zip = { version = "3", default-features = false, features = ["deflate"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "0.8.7", features = ["d1"] }
serde = { version = "1", features = ["derive"] }
futures-util = "0.3"
sha2 = "0.11"

[workspace]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
wildcard_imports = "deny"
too_many_arguments = "deny"

[lints]
workspace = true

[profile.release]
lto = true
codegen-units = 1
